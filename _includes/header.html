{%- if page.url == "/" -%}{%- assign home = "" -%}{%- else -%}{%- assign home = "/" | relative_url -%}{%- endif -%}
<header class="site-header">
    <div class="shell nav-row">
      {% if page.url == "/" %}<a class="wordmark" href="#top" aria-label="Maureen Wepngong, back to top">{% else %}<a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Maureen Wepngong, home">{% endif %}Maureen<span aria-hidden="true">.</span></a>
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" hidden>
        <span class="menu-label">Menu</span><span class="menu-lines" aria-hidden="true"></span>
      </button>
      <nav id="primary-nav" aria-label="Primary navigation">
        <a href="{{ '/product/' | relative_url }}"{% if page.nav == "product" %} aria-current="page"{% endif %}>Product</a>
        <a href="{{ home }}#cardano">Standards</a>
        <a href="{{ home }}#experience">Experience</a>
        <a href="{{ '/blog/' | relative_url }}"{% if page.nav == "blog" %} aria-current="page"{% elsif page.layout == "post" %} aria-current="true"{% endif %}>Writing</a>
        <a class="nav-contact" href="#contact">Contact <svg class="icon" aria-hidden="true"><use href="#icon-arrow"/></svg></a>
      </nav>
    </div>
  </header>
